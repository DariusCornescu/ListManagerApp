# Render Blueprint — provisions a paid Postgres database and the FastAPI web
# service in one shot. Free Postgres is deleted about 44 days after creation, so
# do not use it here. Deploy via Render dashboard: New -> Blueprint -> connect
# this repo. See DEPLOYMENT.md for the full guide.
#
# The service is named "listmanager-api" so its URL becomes
# https://listmanager-api.onrender.com — which is already the default
# BuildConfig.BASE_URL on the Android side, so no app change is needed.

databases:
  - name: listmanager-db
    plan: 0.1c-256mb
    # Can only grow, and each GB is billed. Autoscaling stays off because crash
    # ingest is anonymous and unbounded, so it could be used to inflate the bill.
    diskSizeGB: 5
    databaseName: listmanager
    user: listmanager

services:
  - type: web
    name: listmanager-api
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend-fastapi
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # JWT signing secret — required by the app (fails fast if missing).
      # Render generates a strong random value on first deploy.
      - key: SECRET_KEY
        generateValue: true
      # Postgres connection string, injected from the database above.
      # database.py rewrites postgres:// -> postgresql:// automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: listmanager-db
          property: connectionString
      # Admin account password — seeded on startup (idempotently). Set the
      # real value in the Render dashboard (not committed to git).
      - key: ADMIN_PASSWORD
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional: server-side speech transcription (Groq). Leave unset unless
      # you use the /api/speech/transcribe endpoint.
      # - key: GROQ_API_KEY
      #   sync: false

  # Daily backup to Cloudflare R2, outside Render. A Hobby workspace keeps only 3 days of
  # point-in-time recovery, and nothing survives the database being deleted.
  # Setup and restore steps: DEPLOYMENT.md, "Backups".
  - type: cron
    name: listmanager-db-backup
    runtime: docker
    plan: starter
    # 02:00 UTC, before the shop opens.
    schedule: "0 2 * * *"
    dockerContext: ./ops/db-backup
    dockerfilePath: ./ops/db-backup/Dockerfile
    # Rebuild only when the backup job itself changes.
    buildFilter:
      paths:
        - ops/db-backup/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: listmanager-db
          property: connectionString
      # Entered in the Render dashboard, never committed. The R2 API token should have
      # "Object Read & Write" on this one bucket only.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
