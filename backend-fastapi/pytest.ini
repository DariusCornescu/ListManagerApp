[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    auth: Authentication related tests
    catalog: Catalog (products/distributors) related tests
    sessions: Session management tests
    admin: Admin endpoint tests
