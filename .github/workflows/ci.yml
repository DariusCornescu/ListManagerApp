name: CI

# Pull requests run only the jobs whose folders changed. Pushes to development run everything,
# because Render deploys the backend only after every check on that commit passes.
# Branch protection requires the single "ci-ok" check, which also passes when a job is skipped.

on:
  push:
    branches: [development]
  pull_request:
  # Started by auto-merge.yml after it merges, because its merge push starts no workflows.
  # Like a push, it runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      flutter: ${{ github.event_name != 'pull_request' || steps.filter.outputs.flutter == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
      # The contract between the Android client and the backend breaks from either side.
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.android == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend-fastapi/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android-native/**'
              - '.github/workflows/ci.yml'
            flutter:
              - 'flutter_ui/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: listmanager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-fastapi
    env:
      PIP_AUDIT_VERSION: "2.10.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-fastapi/requirements.txt
      - run: pip install -r requirements.txt "pip-audit==${PIP_AUDIT_VERSION}"
      - run: pip-audit -r requirements.txt
      - name: Tests, including the real PostgreSQL concurrency gate
        run: pytest -q --junitxml="$RUNNER_TEMP/backend-junit.xml"
        env:
          DATABASE_URL: "sqlite:///:memory:"
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/listmanager_test
      # A skipped PostgreSQL gate would still exit 0; this fails it instead.
      - name: Every backend test ran
        if: ${{ !cancelled() }}
        working-directory: .
        run: python .github/scripts/check_test_report.py --suite backend --junit "$RUNNER_TEMP/backend-junit.xml"

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Tool tests (16 KB checker, voice corpus)
        run: python -m unittest discover -s tools -p "test_*.py"
      - run: cp app/src/main/java/com/darius/listmanager/network/ApiConfig.kt.example app/src/main/java/com/darius/listmanager/network/ApiConfig.kt
      - name: Unit, Robolectric and Compose UI tests, lint, and the preview APK
        run: ./gradlew testDebugUnitTest testReleaseUnitTest lintPreview compilePreviewAndroidTestKotlin assemblePreview
      - name: Every unit test ran, or is an allowed skip
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          python .github/scripts/check_test_report.py --suite android-unit \
            --junit "android-native/app/build/test-results/testDebugUnitTest/*.xml" \
            --junit "android-native/app/build/test-results/testReleaseUnitTest/*.xml"
      - name: Native libraries have 16 KB ELF alignment
        run: python tools/check_native_page_alignment.py app/build/outputs/apk/preview/app-preview.apk
      - name: Native libraries are 16 KB aligned inside the APK
        run: |
          zipalign="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          if [ ! -x "$zipalign" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" > /dev/null
          fi
          "$zipalign" -c -P 16 4 app/build/outputs/apk/preview/app-preview.apk
      - name: Keep the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint-report
          path: android-native/app/build/reports/lint-results-preview.html
          if-no-files-found: ignore

  android-instrumented:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: cp app/src/main/java/com/darius/listmanager/network/ApiConfig.kt.example app/src/main/java/com/darius/listmanager/network/ApiConfig.kt
      # Built before the emulator starts, so compiling doesn't compete with it for the runner.
      - run: ./gradlew assemblePreview assemblePreviewAndroidTest
      - id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis
      - name: Create the emulator snapshot for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot created."
      - name: Instrumented tests on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android-native
          script: ./gradlew connectedPreviewAndroidTest
      - name: Every instrumented test ran
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          python3 .github/scripts/check_test_report.py --suite android-instrumented \
            --junit "android-native/app/build/outputs/androidTest-results/connected/**/*.xml"
      - name: Keep the instrumented test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-report
          path: android-native/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  e2e-contract:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: listmanager_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-fastapi/requirements.txt
      - working-directory: backend-fastapi
        run: pip install -r requirements.txt
      - name: Start the backend on PostgreSQL
        working-directory: backend-fastapi
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/listmanager_e2e
          RATE_LIMIT_ENABLED: "false"
        run: |
          # A throwaway key for this run's server only.
          SECRET_KEY="$(openssl rand -hex 32)"
          export SECRET_KEY
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The backend was not healthy after 60 s"
          cat "$RUNNER_TEMP/uvicorn.log"
          exit 1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Android client against the live backend
        working-directory: android-native
        env:
          LIVE_BACKEND_URL: http://127.0.0.1:8000/
          REQUIRE_LIVE_BACKEND: "true"
        run: |
          cp app/src/main/java/com/darius/listmanager/network/ApiConfig.kt.example app/src/main/java/com/darius/listmanager/network/ApiConfig.kt
          ./gradlew testDebugUnitTest --tests "com.darius.listmanager.network.BackendContractE2ETest"
      # Here the contract tests have a backend, so none of them may skip.
      - name: Every contract test ran
        if: ${{ !cancelled() }}
        run: |
          python .github/scripts/check_test_report.py --suite e2e-contract \
            --junit "android-native/app/build/test-results/testDebugUnitTest/TEST-*BackendContractE2ETest.xml"
      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/uvicorn.log"

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: flutter_ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --file-reporter "json:$RUNNER_TEMP/flutter-tests.json"
      - name: Every Flutter test ran, or is an allowed skip
        if: ${{ !cancelled() }}
        working-directory: .
        run: python3 .github/scripts/check_test_report.py --suite flutter --flutter-json "$RUNNER_TEMP/flutter-tests.json"

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # From actionlint_1.7.12_checksums.txt on the release page.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      # shellcheck is preinstalled on ubuntu-latest, so run: scripts are checked too.
      - name: Lint every workflow
        run: '"$RUNNER_TEMP/actionlint" -color'

  # The helper scripts in .github/scripts are code too: their tests run when they change.
  ci-scripts:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s .github/scripts/tests -v

  # Runs on every event, whatever changed: a secret or an AI credit can land in any file.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: No signing keys, credentials or tokens are committed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python .github/scripts/check_committed_secrets.py --range "$BASE_SHA...$HEAD_SHA"
          else
            python .github/scripts/check_committed_secrets.py
          fi
      - name: No AI attribution in commits or the description
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/check_ai_attribution.py --range "$BASE_SHA..$HEAD_SHA" --event-path "$GITHUB_EVENT_PATH"

  ci-ok:
    if: always()
    needs: [changes, backend, android, android-instrumented, e2e-contract, flutter, actionlint, ci-scripts, hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A CI job ended with '$result'"; exit 1 ;;
            esac
          done

  # When development goes red, one open issue says so; the next green run closes it.
  # Not part of ci-ok, so it never blocks anything.
  development-red:
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_RESULT: ${{ needs.ci-ok.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the development-red issue
        run: |
          set -euo pipefail
          label=development-red
          gh label create "$label" --color B60205 --description "CI is failing on development" 2>/dev/null || true
          issue="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"
          if [ "$CI_RESULT" = success ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Green again at ${GITHUB_SHA::7}: $RUN_URL"
              gh issue close "$issue"
              echo "Closed #$issue."
            fi
            exit 0
          fi
          body="CI ended with \`$CI_RESULT\` on \`development\` at ${GITHUB_SHA::7}.

          Run: $RUN_URL

          Render does not deploy a commit with a failed check, so production keeps the last green
          commit. Fix forward with a pull request; this issue closes on the next green run."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
            echo "Updated #$issue."
          else
            gh issue create --label "$label" --title "development is red" --body "$body"
          fi
