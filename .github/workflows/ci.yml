name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: listmanager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
      - name: Tests, including the real PostgreSQL concurrency gate
        run: pytest -q
        env:
          DATABASE_URL: "sqlite:///:memory:"
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/listmanager_test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cp app/src/main/java/com/darius/listmanager/network/ApiConfig.kt.example app/src/main/java/com/darius/listmanager/network/ApiConfig.kt
      - run: ./gradlew testDebugUnitTest testReleaseUnitTest compilePreviewAndroidTestKotlin assemblePreview

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
